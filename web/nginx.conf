server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: react-router handles routes like /login client-side, so any
  # path nginx doesn't have a static file for should still serve index.html
  # instead of a 404 (otherwise a page refresh on anything but / would break).
  location / {
    try_files $uri /index.html;
  }

  # Vite's hashed filenames (index-<hash>.js/css) change whenever their content
  # does, so they're safe to cache indefinitely. index.html is NOT hashed and
  # references those filenames - if it's cached too, a browser can be stuck
  # replaying an old build's asset references indefinitely after every deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
