services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: fraudguard
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdevpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "4000:4000"
    env_file:
      - ./api/.env
    environment:
      PORT: 4000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: devpassword
      MYSQL_DATABASE: fraudguard
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One instance each of worker and scoring-service below. Horizontal scaling
  # (as exercised in Week 6) remains available via:
  #   docker compose up --scale worker=N --scale scoring-service=N
  # Note: the static host port mappings on worker (4001) and scoring-service
  # (8000) would need to be removed or made dynamic first - Compose can't bind
  # multiple replicas of a service to the same fixed host port. That's a
  # follow-up, not something this chunk solves.
  scoring-service:
    build: ./scoring-service
    ports:
      - "8000:8000"
    env_file:
      - ./scoring-service/.env

  worker:
    build: ./worker
    ports:
      - "4001:4001"
    env_file:
      - ./worker/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: devpassword
      MYSQL_DATABASE: fraudguard
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SOCKET_PORT: 4001
      SCORING_SERVICE_URLS: http://scoring-service:8000
      DASHBOARD_ORIGIN: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      scoring-service:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:4000
        VITE_SOCKET_URL: http://localhost:4001
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql_data:
