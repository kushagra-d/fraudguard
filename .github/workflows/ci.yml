name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - working-directory: api
        run: npm ci
      # api/package.json has no "lint" script yet - --if-present skips this
      # silently instead of failing, and picks it up automatically if one is
      # added later.
      - working-directory: api
        run: npm run lint --if-present

  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - working-directory: worker
        run: npm run lint --if-present

  scoring-service-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: scoring-service
        run: pip install -r requirements.txt
      # No test suite here yet - this at least catches syntax errors and
      # missing imports before they reach a running container.
      - working-directory: scoring-service
        run: python -m py_compile main.py

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build
        env:
          VITE_API_URL: http://localhost:4000
          VITE_SOCKET_URL: http://localhost:4001

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t fraudguard-api-ci ./api
      - name: Build worker image
        run: docker build -t fraudguard-worker-ci ./worker
      - name: Build scoring-service image
        run: docker build -t fraudguard-scoring-service-ci ./scoring-service
      - name: Build web image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:4000 \
            --build-arg VITE_SOCKET_URL=http://localhost:4001 \
            -t fraudguard-web-ci ./web
